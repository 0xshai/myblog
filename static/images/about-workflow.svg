<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">博客工作流</title>
  <desc id="desc">从本地写作到 GitHub，再到 Cloudflare Pages 发布的流程。</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}
      .box{fill:#ffffff;stroke:#cfd8e3;stroke-width:2}
      .title{fill:#1d2733;font:800 28px system-ui,Segoe UI,Arial,sans-serif}
      .text{fill:#556271;font:500 18px system-ui,Segoe UI,Arial,sans-serif}
      .arrow{stroke:#3b82f6;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .tag{fill:#eef5ff;stroke:#bfdbfe;stroke-width:2}
      .tagtext{fill:#2563eb;font:700 18px system-ui,Segoe UI,Arial,sans-serif}
    </style>
  </defs>
  <rect width="960" height="360" rx="22" class="bg"/>
  <rect x="62" y="92" width="190" height="150" rx="16" class="box"/>
  <text x="157" y="148" text-anchor="middle" class="title">本地写作</text>
  <text x="157" y="184" text-anchor="middle" class="text">Markdown</text>
  <text x="157" y="212" text-anchor="middle" class="text">hugo server</text>
  <path d="M270 166h90m-18-18 18 18-18 18" class="arrow"/>
  <rect x="384" y="92" width="190" height="150" rx="16" class="box"/>
  <text x="479" y="148" text-anchor="middle" class="title">GitHub</text>
  <text x="479" y="184" text-anchor="middle" class="text">版本管理</text>
  <text x="479" y="212" text-anchor="middle" class="text">Issues / Discussions</text>
  <path d="M592 166h90m-18-18 18 18-18 18" class="arrow"/>
  <rect x="706" y="92" width="190" height="150" rx="16" class="box"/>
  <text x="801" y="148" text-anchor="middle" class="title">Cloudflare</text>
  <text x="801" y="184" text-anchor="middle" class="text">自动构建</text>
  <text x="801" y="212" text-anchor="middle" class="text">静态发布</text>
  <rect x="265" y="282" width="430" height="46" rx="23" class="tag"/>
  <text x="480" y="312" text-anchor="middle" class="tagtext">pull -> write -> preview -> commit -> push</text>
</svg>
