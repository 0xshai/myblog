{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content md-content">
        {{ $opts := dict "display" "block" }}
        {{ .Content | $.Page.RenderString $opts }}
    </div>
    <footer class="entry-footer">
        {{- if site.Params.ShowSiteStats }}
        <p class="site-stats" style="margin-top: 0.75rem; font-size: 0.9rem; color: var(--secondary);">
            本站累计访问 <span id="busuanzi_value_site_pv"></span> 次 · 访客 <span id="busuanzi_value_site_uv"></span> 人
        </p>
        {{- end }}
        <div class="contact-links">
          <!-- GameFlow -->
          <a href="https://gameflow.pages.dev/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4"/><circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="13" r="1" fill="currentColor" stroke="none"/></svg>
            GameFlow 小游戏中心
          </a>
          <!-- 国际音标 -->
          <a href="https://guojiyinbiao.pages.dev/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/><path d="M5 12h4"/><path d="M15 12c0 2.5 2 4 4 4"/><path d="M15 12c0-2 1.5-4 4-4"/></svg>
            国际音标学习
          </a>
          <!-- Python学习 -->
          <a href="https://pythonstudy.pages.dev/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.5-2 4-2 4s2.5-.5 4-2"/><path d="M12 12 8 8"/><path d="M20 4s-5 0-8 3L4 15l5 5 8-8c3-3 3-8 3-8z"/><circle cx="15" cy="9" r="1" fill="currentColor" stroke="none"/></svg>
            Python 星际编程
          </a>
          <!-- 邮箱复制 -->
          <span class="copy-email" onclick="copyEmail()" title="点击复制邮箱">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            shaifx@hotmail.com
            <span class="copy-tip" id="copy-tip">已复制</span>
          </span>
        </div>
        <style>
        .contact-links {
          display: flex;
          gap: 1.5rem;
          margin-top: 0.8rem;
          flex-wrap: wrap;
          align-items: center;
        }
        .copy-email {
          flex-basis: 100%;
          margin-top: 0.25rem;
        }
        .contact-links a,
        .copy-email {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          font-size: 0.9rem;
          opacity: 0.75;
          text-decoration: none;
          color: inherit;
          cursor: pointer;
          position: relative;
        }
        .contact-links a:hover,
        .copy-email:hover { opacity: 1; }
        .copy-tip {
          position: absolute;
          top: -28px;
          left: 50%;
          transform: translateX(-50%);
          background: var(--primary);
          color: var(--theme);
          font-size: 0.75rem;
          padding: 3px 8px;
          border-radius: 4px;
          white-space: nowrap;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s;
        }
        .copy-tip.show { opacity: 1; }
        </style>
        <script>
        function copyEmail() {
          navigator.clipboard.writeText('shaifx@hotmail.com').then(() => {
            const tip = document.getElementById('copy-tip');
            tip.classList.add('show');
            setTimeout(() => tip.classList.remove('show'), 2000);
          });
        }
        </script>
    </footer>
</article>
{{- end -}}
