{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content md-content">
        {{ $opts := dict "display" "block" }}
        {{ .Content | $.Page.RenderString $opts }}
    </div>
    <footer class="entry-footer">
        {{- if site.Params.ShowSiteStats }}
        <p class="site-stats" style="margin-top: 0.75rem; font-size: 0.9rem; color: var(--secondary);">
            本站累计访问 <span id="busuanzi_value_site_pv"></span> 次 · 访客 <span id="busuanzi_value_site_uv"></span> 人
        </p>
        {{- end }}
        <div class="contact-links">
          <!-- 邮箱复制 -->
          <span class="copy-email" onclick="copyEmail()" title="点击复制邮箱">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            shaifx@hotmail.com
            <span class="copy-tip" id="copy-tip">已复制</span>
          </span>
          <!-- GameFlow -->
          <a href="https://gameflow.pages.dev/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
            GameFlow 小游戏中心
          </a>
          <!-- 国际音标 -->
          <a href="https://guojiyinbiao.pages.dev/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>
            国际音标学习
          </a>
          <!-- Python学习 -->
          <a href="https://pythonstudy.pages.dev/" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6.477 2 6 6.477 6 8v2h6v1H6c-2.761 0-4 1.239-4 4v2c0 2.761 1.239 4 4 4h1v-3c0-1.657 1.343-3 3-3h4c1.105 0 2-.895 2-2V8c0-2.761-1.239-4-4-4h-2z"/><circle cx="9" cy="7" r="1" fill="currentColor"/><path d="M12 22c5.523 0 6-4.477 6-6v-2h-6v-1h6c2.761 0 4-1.239 4-4v-2"/><circle cx="15" cy="17" r="1" fill="currentColor"/></svg>
            Python 星际编程
          </a>
        </div>
        <style>
        .contact-links {
          display: flex;
          gap: 1.5rem;
          margin-top: 0.8rem;
          flex-wrap: wrap;
          align-items: center;
        }
        .contact-links a,
        .copy-email {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          font-size: 0.9rem;
          opacity: 0.75;
          text-decoration: none;
          color: inherit;
          cursor: pointer;
          position: relative;
        }
        .contact-links a:hover,
        .copy-email:hover { opacity: 1; }
        .copy-tip {
          position: absolute;
          top: -28px;
          left: 50%;
          transform: translateX(-50%);
          background: var(--primary);
          color: var(--theme);
          font-size: 0.75rem;
          padding: 3px 8px;
          border-radius: 4px;
          white-space: nowrap;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s;
        }
        .copy-tip.show { opacity: 1; }
        </style>
        <script>
        function copyEmail() {
          navigator.clipboard.writeText('shaifx@hotmail.com').then(() => {
            const tip = document.getElementById('copy-tip');
            tip.classList.add('show');
            setTimeout(() => tip.classList.remove('show'), 2000);
          });
        }
        </script>
    </footer>
</article>
{{- end -}}
