<div style="text-align:center; padding: 10px; font-size: 0.85em; opacity: 0.6;">
  本站累计访问 <span id="busuanzi_value_site_pv"></span> 次 · 访客 <span id="busuanzi_value_site_uv"></span> 人
</div>

<div id="google_translate_element" style="display:none;"></div>

<style>
#google_translate_element .goog-te-gadget-simple {
  background: transparent;
  border: none;
  font-size: 0.9em;
  padding: 4px;
  cursor: pointer;
}
#google_translate_element .goog-te-gadget-simple span,
#google_translate_element .goog-te-gadget-simple a {
  color: var(--primary);
  text-decoration: none;
}
/* 隐藏 Google 的 logo 和多余文字 */
#google_translate_element .goog-logo-link,
#google_translate_element .goog-te-gadget-simple img {
  display: none !important;
}
</style>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'zh',
      includedLanguages: 'en',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    },
    'google_translate_element'
  );

  // 等挂件渲染完成后移入导航栏
  setTimeout(function () {
    var el = document.getElementById('google_translate_element');
    var themeToggle = document.getElementById('theme-toggle');
    if (el && themeToggle && themeToggle.parentNode) {
      el.style.display = 'inline-flex';
      el.style.alignItems = 'center';
      themeToggle.parentNode.insertBefore(el, themeToggle);
    }
  }, 500);
}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
