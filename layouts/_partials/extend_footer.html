<div style="text-align:center; padding: 10px; font-size: 0.85em; opacity: 0.6;">
  本站累计访问 <span id="busuanzi_value_site_pv"></span> 次 · 访客 <span id="busuanzi_value_site_uv"></span> 人
</div>

<!-- Google Translate 初始化，隐藏不显示 -->
<div id="google_translate_element" style="display:none;"></div>

<style>
.goog-te-banner-frame,
#goog-gt-tt,
.goog-te-balloon-frame,
div#goog-gt- {
  display: none !important;
}
body { top: 0 !important; }

#lang-toggle {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  color: var(--primary);
  font-size: 0.85em;
  font-weight: 600;
  font-family: inherit;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  opacity: 0.85;
  transition: opacity 0.2s;
  letter-spacing: 0.02em;
}
#lang-toggle:hover { opacity: 1; }
#lang-toggle.is-en { color: var(--primary); opacity: 1; }
</style>

<button id="lang-toggle" title="切换语言 / Toggle Language" onclick="toggleLang()">文</button>

<script>
var langIsEn = (document.cookie.indexOf('googtrans=/zh/en') !== -1);

function updateIcon() {
  var btn = document.getElementById('lang-toggle');
  if (langIsEn) {
    btn.textContent = 'A';
    btn.classList.add('is-en');
    btn.title = '切回中文 / Back to Chinese';
  } else {
    btn.textContent = '文';
    btn.classList.remove('is-en');
    btn.title = '切换英文 / Switch to English';
  }
}

function toggleLang() {
  if (!langIsEn) {
    // 切换到英文：用 select 触发，同时写 cookie
    var select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = 'en';
      select.dispatchEvent(new Event('change'));
    }
    document.cookie = 'googtrans=/zh/en; path=/';
    langIsEn = true;
    updateIcon();
  } else {
    // 切回中文：清 cookie 刷新页面
    document.cookie = 'googtrans=; path=/; expires=' + new Date(0).toUTCString();
    document.cookie = 'googtrans=; path=/; domain=.' + location.hostname + '; expires=' + new Date(0).toUTCString();
    location.reload();
  }
}

function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    { pageLanguage: 'zh', includedLanguages: 'en', autoDisplay: false },
    'google_translate_element'
  );

  setTimeout(function () {
    var btn = document.getElementById('lang-toggle');
    var themeToggle = document.getElementById('theme-toggle');
    if (btn && themeToggle && themeToggle.parentNode) {
      themeToggle.parentNode.insertBefore(btn, themeToggle.nextSibling);
    }
    updateIcon(); // 根据当前 cookie 状态同步图标
  }, 600);
}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
