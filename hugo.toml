baseURL = "/"
locale = "zh-CN"
title = "SHAIFX的技术博客"
theme = "PaperMod"

[params]
  # 首页模式：profile显示头像简介，index显示文章列表
  [params.homeInfoParams]
  Title = "SHAIFX 👋"
  Content = "> 写代码、做游戏、搞AI、拥抱开源。\n>\n> 折腾是目的，开源是态度。"
  defaultTheme = "auto"        # 自动跟随系统深色/浅色
  ShowReadingTime = true       # 阅读时间
  ShowShareButtons = false     # 分享按钮
  ShowPostNavLinks = true      # 上一篇/下一篇
  ShowBreadCrumbs = true       # 面包屑导航
  ShowCodeCopyButtons = true   # 代码块复制按钮
  ShowToc = true               # 文章目录
  TocOpen = false              # 目录默认折叠
comments = true

[params.giscus]
repo = "0xshai/myblog"
repoId = "R_kgDOSjif3g"
category = "Announcements"
categoryId = "DIC_kwDOSjif3s4C9qHd"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
theme = "preferred_color_scheme"
lang = "zh-CN"

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 3
  [[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]  # JSON给搜索功能用